<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Annotation Voice Mode</title><!--CONFIG--><link rel="stylesheet" href="host.css"></head><body>
<main><section class="frame focused" aria-label="Live annotation sidebar"><div class="surface"></div></section>
<section class="workspace" aria-label="Screen annotation"><div class="workspace-actions"><span id="delivery-status" role="status" aria-live="polite"></span><button id="retry" hidden>Retry delivery</button><button id="reload-project" hidden>Reload project</button><button id="show-project" hidden>Back to project</button><a id="open-project" target="_blank" rel="noopener noreferrer" hidden>Open original</a><button id="share">Share a window</button></div>
<div id="capture-stage"><div id="capture-empty">Share a window to annotate it, or use + to add screenshots.</div><iframe id="project-preview" title="Interactive project preview" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads" hidden></iframe><iframe id="capture" title="Shared window annotation" src="capture.html" allow="display-capture" hidden></iframe></div>
<span id="capture-status" role="status" aria-live="polite"></span></section></main>
<script src="capture-store.js"></script><script src="voice-bridge.js"></script><script src="host.js"></script></body></html>
